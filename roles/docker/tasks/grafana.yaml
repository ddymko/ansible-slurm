---
- name: Create Grafana data directory
  file:
    path: /opt/grafana
    state: directory
    mode: "0755"

- name: Pull Grafana Docker image
  community.docker.docker_image:
    name: grafana/grafana:latest
    source: pull

- name: Check if Grafana container exists
  community.docker.docker_container_info:
    name: grafana
  register: grafana_info

- name: Stop and remove existing Grafana container if running
  community.docker.docker_container:
    name: grafana
    state: absent
  when: grafana_info.exists

- name: Run Grafana container with Anonymous Access
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:latest
    restart_policy: always
    state: started
    ports:
      - "3000:3000"
    env:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "none"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SERVER_PROTOCOL: "http"
      GF_SERVER_ROOT_URL: "http://{{ ansible_default_ipv4.address }}:3000/"

      # ✅ Disable Authentication & Enable Anonymous Access
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - "grafana_data:/var/lib/grafana"