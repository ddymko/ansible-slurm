global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["smn01:9100", "swn02:9100", "swn03:9100", "swn04:9100"]

  - job_name: 'slurm_exporter'
    scrape_interval: 30s
    scrape_timeout: 30s
    static_configs:
        - targets: ['smn01:9341']

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]