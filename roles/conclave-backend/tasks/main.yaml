- name: Clone the repository
  git:
    repo: 'git@github.com:ddymko/conclave-backend.git'
    dest: /opt/conclave
    version: main
    force: yes

- name: Tidy Go modules
  command: go mod tidy
  args:
    chdir: "{{ source_dir }}"
  register: tidy_result
  changed_when: tidy_result.rc == 0

- name: Build the Go binary
  command: go build -o {{ binary_dest }}
  args:
    chdir: "{{ source_dir }}/cmd"
  environment:
    GOOS: "{{ go_os }}"
    GOARCH: "{{ go_arch }}"
  register: build_result
  # Mark as changed when build returns 0 (successful)
  changed_when: build_result.rc == 0


- name: Ensure the binary is executable
  file:
    path: "{{ binary_dest }}"
    mode: '0755'
    owner: root
    group: root

- name: Template systemd service file
  template:
    src: conclave-backend.service.j2
    dest: /etc/systemd/system/conclave-backend.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart Conclave Backend